<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>视频文案提取</title>
<style>
  :root { --red:#ff2442; --bg:#fafafa; --card:#fff; --line:#eee; --muted:#888; --green:#3a3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
         background:var(--bg); color:#222; -webkit-text-size-adjust:100%; }
  .wrap { max-width:820px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin-bottom:4px; text-align:center; }
  h1 span { color:var(--red); }
  .sub { font-size:13px; color:var(--muted); margin-bottom:14px; text-align:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line);
          border-radius:8px; font-size:16px; font-family:inherit;
          -webkit-appearance:none; appearance:none; }
  input[type=file] { padding:8px; font-size:14px; }
  textarea { min-height:120px; resize:vertical; }
  button { background:var(--red); color:#fff; border:none; padding:12px 16px;
          border-radius:8px; font-size:15px; cursor:pointer; width:100%;
          -webkit-tap-highlight-color:transparent; }
  button.ghost { background:#fff; color:var(--red); border:1px solid var(--red); }
  button.small { width:auto; padding:6px 14px; font-size:13px; }
  button:disabled { opacity:.5; cursor:wait; }
  button:active { opacity:.8; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .msg { font-size:13px; margin-top:8px; word-break:break-all; }
  .msg.err { color:var(--red); }
  .msg.ok { color:var(--green); }
  .hidden { display:none; }
  details summary { cursor:pointer; font-size:13px; color:var(--muted); padding:4px 0; }
  .transcript-box { background:#f9f9f9; border:1px solid var(--line); border-radius:8px;
                    padding:12px; font-size:13px; line-height:1.8; max-height:250px;
                    overflow-y:auto; white-space:pre-wrap; margin-top:8px;
                    -webkit-overflow-scrolling:touch; }
  .seg-time { color:var(--red); font-size:11px; margin-right:4px; }
  .or-divider { text-align:center; color:var(--muted); font-size:12px; margin:14px 0;
                position:relative; }
  .or-divider::before, .or-divider::after { content:''; position:absolute; top:50%;
    width:38%; height:1px; background:var(--line); }
  .or-divider::before { left:0; }
  .or-divider::after { right:0; }
  .key-group { background:#f9f9f9; border-radius:8px; padding:12px; margin-top:8px; }
  .key-group h4 { margin:0 0 8px; font-size:13px; }
  .key-group input { margin-bottom:6px; }

  /* Tabs */
  .tabs { display:flex; gap:0; margin:12px 0 16px; }
  .tab { flex:1; text-align:center; padding:10px 4px; font-size:13px; font-weight:600;
         border-bottom:3px solid var(--line); color:var(--muted); cursor:pointer; transition:.2s; }
  .tab.active { border-color:var(--red); color:var(--red); }

  /* Batch results */
  .batch-item { background:#f9f9f9; border:1px solid var(--line); border-radius:8px;
                padding:12px; margin-bottom:10px; }
  .batch-item h4 { font-size:14px; margin-bottom:6px; }
  .batch-item .status { font-size:12px; color:var(--muted); }
  .batch-item .status.done { color:var(--green); }
  .batch-item .status.err { color:var(--red); }
  .batch-text { font-size:13px; line-height:1.6; max-height:150px; overflow-y:auto;
                white-space:pre-wrap; margin-top:6px; }
  .batch-actions { margin-top:8px; display:flex; gap:6px; }

  /* Comments */
  .comment-item { padding:10px 0; border-bottom:1px solid var(--line); }
  .comment-item:last-child { border-bottom:none; }
  .comment-author { font-size:12px; color:var(--muted); }
  .comment-text { font-size:14px; line-height:1.6; margin-top:4px; }
  .comment-likes { font-size:12px; color:var(--red); margin-top:4px; }
  .copy-btn { background:none; border:1px solid var(--line); color:#222; width:auto;
              padding:4px 10px; font-size:12px; border-radius:4px; cursor:pointer; }
  .copy-btn:active { background:#f0f0f0; }

  @media (max-width:600px) {
    .wrap { padding:12px; }
    h1 { font-size:18px; }
    .card { padding:14px; border-radius:10px; }
    input, textarea { font-size:16px; padding:10px; }
    button { padding:12px; font-size:15px; }
    .tab { font-size:12px; padding:8px 2px; }
    .transcript-box { max-height:200px; font-size:12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>视频 <span>文案提取</span></h1>
  <div class="sub">提取视频逐字稿 · 批量处理 · 高赞评论</div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">单个提取</div>
    <div class="tab" onclick="switchTab(1)">批量提取</div>
    <div class="tab" onclick="switchTab(2)">高赞评论</div>
  </div>

  <!-- ========== Tab 0: 单个提取 ========== -->
  <div class="tab-page" id="tab0">
    <div class="card">
      <label>视频链接</label>
      <input id="link" placeholder="粘贴视频链接（小红书、抖音、B站、YouTube 等）">
      <button onclick="doFetchAndTranscribe()" style="margin-top:8px;">提取标题 + 逐字稿</button>
      <div id="fetchMsg" class="msg"></div>

      <div class="or-divider">或 上传本地视频</div>
      <input type="file" id="videoFile" accept="video/*">
      <button onclick="doTranscribeUpload()" style="margin-top:8px;">上传并转写</button>
      <div id="uploadMsg" class="msg"></div>

      <div id="transcriptWrap" class="hidden">
        <details>
          <summary>查看带时间轴的逐字稿</summary>
          <div id="transcriptBox" class="transcript-box"></div>
        </details>
      </div>

      <label>标题</label>
      <input id="title" placeholder="自动抓取或手动填写">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <label style="margin:0;">正文 / 逐字稿</label>
        <div style="display:flex;gap:6px;">
          <button class="copy-btn" onclick="copyText('content')">复制</button>
          <button id="corrBtn" onclick="doCorrect()" class="small ghost" style="width:auto;border-radius:6px;">✨ AI 纠错</button>
        </div>
      </div>
      <textarea id="content" placeholder="自动提取或手动粘贴笔记正文"></textarea>
      <div id="corrMsg" class="msg" style="margin-top:4px;"></div>

      <button onclick="doExport()" class="ghost" style="margin-top:10px;font-size:13px;padding:10px;">📄 导出为 Word 文档</button>
      <div id="exportMsg" class="msg" style="margin-top:4px;"></div>
    </div>
  </div>

  <!-- ========== Tab 1: 批量提取 ========== -->
  <div class="tab-page hidden" id="tab1">
    <div class="card">
      <label>粘贴多个链接（每行一个，最多 10 个）</label>
      <textarea id="batchLinks" style="min-height:150px;" placeholder="https://...&#10;https://...&#10;https://..."></textarea>
      <button onclick="doBatch()" style="margin-top:8px;">开始批量提取</button>
      <div id="batchMsg" class="msg"></div>
    </div>
    <div id="batchResults"></div>
    <div id="batchExportWrap" class="hidden" style="margin-bottom:16px;">
      <button onclick="doBatchExport()" class="ghost" style="font-size:13px;padding:10px;">📄 全部导出为 Word 文档</button>
      <div id="batchExportMsg" class="msg"></div>
    </div>
  </div>

  <!-- ========== Tab 2: 高赞评论 ========== -->
  <div class="tab-page hidden" id="tab2">
    <div class="card">
      <label>视频链接</label>
      <input id="commentLink" placeholder="粘贴视频链接">
      <button onclick="doComments()" style="margin-top:8px;">提取高赞评论</button>
      <div id="commentMsg" class="msg"></div>
      <div id="commentList" class="hidden" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- 设置（全局） -->
  <details style="margin-top:4px;">
    <summary style="font-size:13px;color:var(--muted);cursor:pointer;">设置（可选）</summary>
    <div class="card" style="margin-top:8px;">
      <div class="key-group">
        <h4>Cookie（可选）</h4>
        <div class="hint" style="margin-bottom:8px;">某些平台需要 Cookie 才能下载视频</div>
        <input id="cookie" placeholder="从浏览器复制对应平台的 Cookie">
      </div>
    </div>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
const getVal = id => { const el = $(id); return el ? el.value.trim() : ''; };

// Tab switching
function switchTab(n) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
  document.querySelectorAll('.tab-page').forEach((p,i) => p.classList.toggle('hidden', i!==n));
}

function showMsg(id, text, isErr) {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg ' + (isErr ? 'err' : 'ok');
}

function copyText(id) {
  const el = $(id);
  const text = el.value || el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制', 1500);
  }).catch(() => {
    el.select && el.select();
    document.execCommand('copy');
  });
}

// ========== 单个提取 ==========
async function doFetchAndTranscribe() {
  const link = $('link').value.trim();
  if (!link) { showMsg('fetchMsg','请输入链接',true); return; }
  showMsg('fetchMsg','正在提取标题和逐字稿，请耐心等待（1~3分钟）...', false);
  try {
    const body = {link, cookie:getVal('cookie')};
    const r = await fetch('/transcribe_link', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const d = await r.json();
    if (d.ok && d.task_id) { pollTask(d.task_id, 'fetchMsg'); }
    else { showMsg('fetchMsg', d.error||'请求失败', true); }
  } catch(e) { showMsg('fetchMsg','请求失败: '+e, true); }
}

async function doTranscribeUpload() {
  const file = $('videoFile').files[0];
  if (!file) { showMsg('uploadMsg','请选择视频文件',true); return; }
  showMsg('uploadMsg','上传并转写中，请耐心等待...', false);
  const fd = new FormData(); fd.append('video', file);
  try {
    const r = await fetch('/transcribe_upload', {method:'POST', body:fd});
    const d = await r.json();
    if (d.ok && d.task_id) { pollTask(d.task_id, 'uploadMsg'); }
    else { showMsg('uploadMsg', d.error||'请求失败', true); }
  } catch(e) { showMsg('uploadMsg','请求失败: '+e, true); }
}

function pollTask(taskId, msgId) {
  const iv = setInterval(async () => {
    try {
      const r = await fetch('/task/' + taskId);
      const d = await r.json();
      if (d.status === 'processing') return;
      clearInterval(iv);
      if (d.ok && d.status === 'done') {
        showTranscript(d);
        showMsg(msgId, '逐字稿提取成功！', false);
      } else { showMsg(msgId, d.error || '转写失败', true); }
    } catch(e) { clearInterval(iv); showMsg(msgId, '轮询失败: '+e, true); }
  }, 3000);
}

function showTranscript(data) {
  if (data.title) $('title').value = data.title;
  $('content').value = data.text || '';
  const wrap = $('transcriptWrap'), box = $('transcriptBox');
  wrap.classList.remove('hidden');
  if (data.segments && data.segments.length) {
    box.innerHTML = data.segments.map(s =>
      `<span class="seg-time">[${fmtTime(s.start)}]</span>${esc(s.text)}`
    ).join('\n');
  } else { box.textContent = data.text || ''; }
}

function fmtTime(sec) {
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}

async function doCorrect() {
  const content = $('content').value.trim();
  if (!content) { showMsg('corrMsg','逐字稿为空',true); return; }
  $('corrBtn').disabled = true; $('corrBtn').textContent = '纠错中...';
  showMsg('corrMsg','AI 校对中，约 10-20 秒...', false);
  try {
    const r = await fetch('/correct', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content})});
    const d = await r.json();
    if (d.ok) { $('content').value = d.content; showMsg('corrMsg','已完成纠错 ✓', false); }
    else { showMsg('corrMsg', d.error, true); }
  } catch(e) { showMsg('corrMsg','请求失败: '+e, true); }
  $('corrBtn').disabled = false; $('corrBtn').textContent = '✨ AI 纠错';
}

async function doExport() {
  const content = $('content').value.trim();
  if (!content) { showMsg('exportMsg','逐字稿为空',true); return; }
  showMsg('exportMsg','生成中...', false);
  try {
    const r = await fetch('/export_docx', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:$('title').value, content})});
    if (!r.ok) { const d = await r.json(); showMsg('exportMsg', d.error, true); return; }
    downloadBlob(await r.blob(), r);
    showMsg('exportMsg','已下载 ✓', false);
  } catch(e) { showMsg('exportMsg','导出失败: '+e, true); }
}

function downloadBlob(blob, resp) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const cd = (resp.headers && resp.headers.get('content-disposition')) || '';
  const m = cd.match(/filename\*?=(?:UTF-8'')?([^;]+)/i);
  a.download = m ? decodeURIComponent(m[1].replace(/"/g,'')) : '逐字稿.docx';
  a.click(); URL.revokeObjectURL(a.href);
}

// ========== 批量提取 ==========
let batchData = []; // [{title, text, link, status}]

async function doBatch() {
  const text = $('batchLinks').value.trim();
  if (!text) { showMsg('batchMsg','请输入链接',true); return; }
  showMsg('batchMsg','正在批量提取，请耐心等待...', false);
  batchData = [];
  $('batchResults').innerHTML = '';
  $('batchExportWrap').classList.add('hidden');

  try {
    const r = await fetch('/batch_transcribe', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({links:text, cookie:getVal('cookie')})});
    const d = await r.json();
    if (!d.ok) { showMsg('batchMsg', d.error, true); return; }

    const taskIds = d.task_ids;
    // 初始化占位
    taskIds.forEach((tid, i) => {
      batchData.push({title:'', text:'', link:'', status:'processing'});
      renderBatchItem(i);
    });

    // 轮询每个任务
    let doneCount = 0;
    const iv = setInterval(async () => {
      for (let i = 0; i < taskIds.length; i++) {
        if (batchData[i].status !== 'processing') continue;
        try {
          const r = await fetch('/task/' + taskIds[i]);
          const d = await r.json();
          if (d.status === 'processing') continue;
          if (d.ok && d.status === 'done') {
            batchData[i] = {title:d.title||'', text:d.text||'', link:d.link||'', status:'done'};
          } else {
            batchData[i] = {title:'', text:'', link:'', status:'error', error:d.error||'失败'};
          }
          renderBatchItem(i);
          doneCount++;
        } catch(e) {}
      }
      if (doneCount >= taskIds.length) {
        clearInterval(iv);
        const okCount = batchData.filter(b=>b.status==='done').length;
        showMsg('batchMsg', `完成！成功 ${okCount}/${taskIds.length}`, okCount < taskIds.length);
        if (okCount > 0) $('batchExportWrap').classList.remove('hidden');
      }
    }, 3000);
  } catch(e) { showMsg('batchMsg','请求失败: '+e, true); }
}

function renderBatchItem(i) {
  const container = $('batchResults');
  let el = $('batch-'+i);
  if (!el) {
    el = document.createElement('div');
    el.id = 'batch-'+i;
    el.className = 'batch-item';
    container.appendChild(el);
  }
  const b = batchData[i];
  if (b.status === 'processing') {
    el.innerHTML = `<div class="status">⏳ 第 ${i+1} 个 - 提取中...</div>`;
  } else if (b.status === 'error') {
    el.innerHTML = `<div class="status err">❌ 第 ${i+1} 个 - ${esc(b.error)}</div>`;
  } else {
    el.innerHTML = `
      <h4>${esc(b.title || '第 '+(i+1)+' 个')}</h4>
      <div class="status done">✓ 提取成功</div>
      <div class="batch-text">${esc(b.text)}</div>
      <div class="batch-actions">
        <button class="copy-btn" onclick="navigator.clipboard.writeText(batchData[${i}].text);this.textContent='已复制 ✓';setTimeout(()=>this.textContent='复制文案',1500)">复制文案</button>
      </div>`;
  }
}

async function doBatchExport() {
  const items = batchData.filter(b => b.status === 'done');
  if (!items.length) return;
  // 合并为一个文档
  const combined = items.map(b => {
    const title = b.title || '(无标题)';
    return `【${title}】\n${b.text}`;
  }).join('\n\n────────────────\n\n');
  showMsg('batchExportMsg','生成中...', false);
  try {
    const r = await fetch('/export_docx', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:'批量提取_'+items.length+'篇', content:combined})});
    if (!r.ok) { const d = await r.json(); showMsg('batchExportMsg', d.error, true); return; }
    downloadBlob(await r.blob(), r);
    showMsg('batchExportMsg','已下载 ✓', false);
  } catch(e) { showMsg('batchExportMsg','导出失败: '+e, true); }
}

// ========== 高赞评论 ==========
async function doComments() {
  const link = $('commentLink').value.trim();
  if (!link) { showMsg('commentMsg','请输入链接',true); return; }
  showMsg('commentMsg','正在提取评论...', false);
  $('commentList').classList.add('hidden');

  try {
    const r = await fetch('/comments', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({link, cookie:getVal('cookie')})});
    const d = await r.json();
    if (!d.ok) { showMsg('commentMsg', d.error, true); return; }

    showMsg('commentMsg', `提取到 ${d.comments.length} 条高赞评论`, false);
    const list = $('commentList');
    list.classList.remove('hidden');
    list.innerHTML = d.comments.map((c, i) => `
      <div class="comment-item">
        <div class="comment-author">${esc(c.author)}</div>
        <div class="comment-text">${esc(c.text)}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
          <span class="comment-likes">❤️ ${c.likes}</span>
          <button class="copy-btn" onclick="navigator.clipboard.writeText(${JSON.stringify(JSON.stringify(c.text))});this.textContent='已复制 ✓';setTimeout(()=>this.textContent='复制',1500)">复制</button>
        </div>
      </div>`).join('');

    // 一键复制全部
    list.innerHTML += `<button onclick="copyAllComments()" class="ghost" style="margin-top:12px;font-size:13px;padding:10px;">复制全部评论</button>`;
    window._commentsData = d.comments;
  } catch(e) { showMsg('commentMsg','请求失败: '+e, true); }
}

function copyAllComments() {
  if (!window._commentsData) return;
  const text = window._commentsData.map((c,i) =>
    `${i+1}. ${c.text}  (❤️${c.likes})`
  ).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showMsg('commentMsg','已复制全部评论 ✓', false);
  });
}

function esc(s) { return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
</script>
</body>
</html>
