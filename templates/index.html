<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书爆款选题拆解</title>
<style>
  :root { --red:#ff2442; --bg:#fafafa; --card:#fff; --line:#eee; --muted:#888; --green:#3a3; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
         background:var(--bg); margin:0; padding:16px; color:#222; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  h1 span { color:var(--red); }
  .sub { font-size:13px; color:var(--muted); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--line);
          border-radius:8px; font-size:14px; font-family:inherit; }
  input[type=file] { padding:8px; }
  textarea { min-height:140px; resize:vertical; }
  button { background:var(--red); color:#fff; border:none; padding:10px 20px;
          border-radius:8px; font-size:14px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--red); border:1px solid var(--red); }
  button.sm { padding:6px 14px; font-size:13px; }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .row > div { flex:1; min-width:200px; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .hint a { color:var(--red); }
  .msg { font-size:13px; margin-top:8px; }
  .msg.err { color:var(--red); }
  .msg.ok { color:var(--green); }
  .steps { display:flex; gap:0; margin:16px 0; }
  .step { flex:1; text-align:center; padding:8px; font-size:13px; font-weight:600;
          border-bottom:3px solid var(--line); color:var(--muted); transition:.2s; }
  .step.active { border-color:var(--red); color:var(--red); }
  .step.done { border-color:var(--green); color:var(--green); }
  .sec { margin-bottom:18px; }
  .sec h3 { margin:0 0 8px; font-size:15px; border-left:3px solid var(--red); padding-left:8px; }
  .chip { display:inline-block; background:#fff0f2; color:var(--red);
          border-radius:14px; padding:3px 10px; font-size:12px; margin:3px 4px 3px 0; }
  ol { margin:6px 0; padding-left:20px; }
  .takeaway { background:#fff0f2; border-radius:8px; padding:12px; font-size:14px; }
  .hidden { display:none; }
  details summary { cursor:pointer; font-size:13px; color:var(--muted); }
  .transcript-box { background:#f9f9f9; border:1px solid var(--line); border-radius:8px;
                    padding:12px; font-size:13px; line-height:1.8; max-height:300px;
                    overflow-y:auto; white-space:pre-wrap; margin-top:8px; }
  .seg-time { color:var(--red); font-size:11px; margin-right:4px; }
  .or-divider { text-align:center; color:var(--muted); font-size:12px; margin:12px 0;
                position:relative; }
  .or-divider::before, .or-divider::after { content:''; position:absolute; top:50%;
    width:40%; height:1px; background:var(--line); }
  .or-divider::before { left:0; }
  .or-divider::after { right:0; }
  .key-group { background:#f9f9f9; border-radius:8px; padding:12px; margin-top:8px; }
  .key-group h4 { margin:0 0 8px; font-size:13px; }
  .key-group input { margin-bottom:6px; }
  @media (max-width:600px) {
    body { padding:10px; }
    .row { flex-direction:column; }
    .steps .step { font-size:11px; padding:6px 2px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>小红书 <span>爆款选题</span> 拆解</h1>
  <div class="sub">视频笔记提取逐字稿 → AI 四维拆解爆款规律</div>

  <div class="steps">
    <div class="step active" id="s1">① 获取文案</div>
    <div class="step" id="s2">② AI 拆解</div>
    <div class="step" id="s3">③ 查看结果</div>
  </div>

  <div class="card" id="card1">
    <label>笔记链接</label>
    <div class="row">
      <div><input id="link" placeholder="粘贴小红书笔记链接或分享文案"></div>
      <button class="ghost sm" onclick="doFetch()">抓标题</button>
      <button class="sm" onclick="doTranscribeLink()">提取逐字稿</button>
    </div>
    <div id="fetchMsg" class="msg"></div>

    <div class="or-divider">或 上传本地视频</div>
    <div class="row">
      <div><input type="file" id="videoFile" accept="video/*"></div>
      <button class="sm" onclick="doTranscribeUpload()">上传并转写</button>
    </div>
    <div id="uploadMsg" class="msg"></div>

    <div id="transcriptWrap" class="hidden">
      <label>逐字稿（已自动填入正文）</label>
      <div id="transcriptBox" class="transcript-box"></div>
    </div>

    <label>标题</label>
    <input id="title" placeholder="自动抓取或手动填写">

    <label>正文 / 逐字稿</label>
    <textarea id="content" placeholder="自动提取或手动粘贴笔记正文"></textarea>

    <details style="margin-top:10px;">
      <summary>设置（首次使用需要配置 API key）</summary>

      <div class="key-group">
        <h4>阿里云语音识别（视频转逐字稿）</h4>
        <div class="hint" style="margin-bottom:8px;">
          <a href="https://nls-portal.console.aliyun.com" target="_blank">开通智能语音交互</a> →
          创建项目获取 AppKey →
          <a href="https://ram.console.aliyun.com/manage/ak" target="_blank">创建 AccessKey</a>
        </div>
        {% if not has_ali %}
        <input id="aliAppkey" placeholder="AppKey（从语音项目中获取）">
        <input id="aliAkId" placeholder="AccessKey ID">
        <input id="aliAkSecret" type="password" placeholder="AccessKey Secret">
        {% endif %}
      </div>

      {% if not has_anthropic %}
      <div class="key-group" style="margin-top:10px;">
        <h4>Anthropic（AI 拆解分析）</h4>
        <div class="hint" style="margin-bottom:8px;">
          <a href="https://console.anthropic.com" target="_blank">获取 API key</a>（需要海外支付方式）
        </div>
        <input id="apikey" type="password" placeholder="sk-ant-...">
      </div>
      {% endif %}

      <label>小红书 Cookie（可选，提高抓取成功率）</label>
      <input id="cookie" placeholder="从浏览器复制小红书的 Cookie">
    </details>

    <div style="margin-top:14px;">
      <button id="anaBtn" onclick="doAnalyze()">开始拆解</button>
    </div>
    <div id="anaMsg" class="msg"></div>
  </div>

  <div id="result" class="card hidden"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const getVal = id => { const el = $(id); return el ? el.value.trim() : ''; };

function setStep(n) {
  ['s1','s2','s3'].forEach((id,i) => {
    $(id).classList.toggle('done', i < n-1);
    $(id).classList.toggle('active', i === n-1);
  });
}

function showMsg(id, text, isErr) {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg ' + (isErr ? 'err' : 'ok');
}

function aliKeys() {
  return {
    ali_appkey: getVal('aliAppkey'),
    ali_ak_id: getVal('aliAkId'),
    ali_ak_secret: getVal('aliAkSecret'),
  };
}

async function doFetch() {
  const link = $('link').value.trim();
  if (!link) { showMsg('fetchMsg','请输入链接',true); return; }
  showMsg('fetchMsg','抓取中...', false);
  try {
    const r = await fetch('/fetch', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({link, cookie:getVal('cookie')})});
    const d = await r.json();
    if (d.ok) {
      if (d.title) $('title').value = d.title;
      if (d.content) $('content').value = d.content;
      const msgs = {auto:'抓取成功', meta:'只抓到摘要，建议核对正文', partial:'只抓到标题，正文需要转写视频或手动粘贴'};
      showMsg('fetchMsg', msgs[d.source]||'抓取成功', d.source==='partial');
    } else { showMsg('fetchMsg', d.error, true); }
  } catch(e) { showMsg('fetchMsg','请求失败: '+e, true); }
}

async function doTranscribeLink() {
  const link = $('link').value.trim();
  if (!link) { showMsg('fetchMsg','请输入链接',true); return; }
  showMsg('fetchMsg','下载视频并转写中，请耐心等待（30秒~2分钟）...', false);
  try {
    const body = {link, cookie:getVal('cookie'), ...aliKeys()};
    const r = await fetch('/transcribe_link', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const d = await r.json();
    if (d.ok) {
      showTranscript(d);
      showMsg('fetchMsg','逐字稿提取成功！', false);
    } else { showMsg('fetchMsg', d.error, true); }
  } catch(e) { showMsg('fetchMsg','请求失败: '+e, true); }
}

async function doTranscribeUpload() {
  const file = $('videoFile').files[0];
  if (!file) { showMsg('uploadMsg','请选择视频文件',true); return; }
  showMsg('uploadMsg','上传并转写中，请耐心等待...', false);

  const fd = new FormData();
  fd.append('video', file);
  const keys = aliKeys();
  Object.entries(keys).forEach(([k,v]) => { if(v) fd.append(k,v); });

  try {
    const r = await fetch('/transcribe_upload', {method:'POST', body:fd});
    const d = await r.json();
    if (d.ok) {
      showTranscript(d);
      showMsg('uploadMsg','逐字稿提取成功！', false);
    } else { showMsg('uploadMsg', d.error, true); }
  } catch(e) { showMsg('uploadMsg','请求失败: '+e, true); }
}

function showTranscript(data) {
  $('content').value = data.text || '';
  const wrap = $('transcriptWrap');
  const box = $('transcriptBox');
  wrap.classList.remove('hidden');
  if (data.segments && data.segments.length) {
    box.innerHTML = data.segments.map(s => {
      const t = fmtTime(s.start);
      return `<span class="seg-time">[${t}]</span>${esc(s.text)}`;
    }).join('\n');
  } else {
    box.textContent = data.text || '';
  }
}

function fmtTime(sec) {
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}

async function doAnalyze() {
  const content = $('content').value.trim();
  if (!content) { showMsg('anaMsg','正文为空，请先提取逐字稿或粘贴正文',true); return; }
  setStep(2);
  $('anaBtn').disabled = true; $('anaBtn').textContent = '拆解中...';
  showMsg('anaMsg','AI 分析中，约 10-20 秒...', false);
  try {
    const body = {title:$('title').value, content, api_key:getVal('apikey')};
    const r = await fetch('/analyze', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const d = await r.json();
    if (d.ok) { render(d.result); setStep(3); showMsg('anaMsg','',false); }
    else { showMsg('anaMsg', d.error, true); setStep(1); }
  } catch(e) { showMsg('anaMsg','请求失败: '+e, true); setStep(1); }
  $('anaBtn').disabled = false; $('anaBtn').textContent = '开始拆解';
}

function chips(arr) { return (arr||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join(''); }
function list(arr) { return '<ol>'+(arr||[]).map(t=>`<li>${esc(t)}</li>`).join('')+'</ol>'; }
function esc(s) { return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function render(r) {
  const box = $('result');
  box.classList.remove('hidden');
  const t=r.title_tactics||{}, s=r.structure||{}, k=r.keywords_tags||{}, a=r.angle_audience||{};
  box.innerHTML = `
    <div class="sec"><h3>① 标题套路</h3>
      ${chips(t.hook_types)}<p>${esc(t.analysis||'')}</p></div>
    <div class="sec"><h3>② 内容结构</h3>
      ${list(s.outline)}<p>${esc(s.analysis||'')}</p></div>
    <div class="sec"><h3>③ 关键词与标签</h3>
      <label>核心关键词</label>${chips(k.keywords)}
      <label>建议标签</label>${chips(k.suggested_tags)}</div>
    <div class="sec"><h3>④ 选题角度与受众</h3>
      <p><b>人群：</b>${esc(a.target_audience||'')}</p>
      <p><b>需求：</b>${esc(a.core_need||'')}</p>
      <p><b>情绪：</b>${esc(a.emotion||'')}</p>
      <p><b>角度/公式：</b>${esc(a.angle||'')}</p></div>
    <div class="sec"><h3>可复用建议</h3>
      <div class="takeaway">${esc(r.replicable_takeaway||'')}</div></div>`;
  box.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
